# Studiocord settings.
#   Windows: %APPDATA%\Studiocord\config.toml    (Start menu > Studiocord > Studiocord settings)
#   Linux:   ~/.config/studiocord/config.toml
# After editing, restart Studiocord:
#   Windows: sign out and in again, or end "studiocord.exe" in Task Manager and run it again
#   Linux:   systemctl --user restart studiocord

# Discord application shown as "Playing <name>". Default is Vinegar's "Roblox Studio"
# app (it has the "place" and "script" small icons). Make your own at
# https://discord.com/developers/applications and upload images named "place" and "script".
client_id = "1159891020956323923"

# Where Roblox Studio writes its logs. Empty = the usual place on this system
# (%LOCALAPPDATA%\Roblox\logs on Windows, Vinegar's folder on Linux).
logs_dir = ""

show_place_name = true      # false = "Editing a place", no name/icon/button
show_button = true          # "View on Roblox" button for published places
show_team_create = true     # append "· Team Create" when connected
show_script_name = true     # "Editing <ScriptName>" (uses the Studiocord Studio plugin)
show_line_count = true      # "Editing Main (120 lines)"
auto_install_plugin = true  # put the Studio plugin back if it's deleted or Studio is reinstalled
show_idle = true            # show "On the start page" when no place is open
plugin_port = 47231         # must match the URL in the Studio plugin
poll_seconds = 1.0
